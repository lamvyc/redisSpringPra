spring:
  application:
    name: redisSpringPra
  data:
    redis:
      host: localhost
      port: 6379
      # 密码为空则不填，如有密码：password: xxx
      database: 0
      timeout: 3s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 16
          # 连接池最大空闲连接
          max-idle: 8
          # 连接池最小空闲连接
          min-idle: 2
          # 获取连接最大等待时间
          max-wait: 3s
  cache:
    type: redis
    redis:
      # 全局默认缓存过期时间 10 分钟
      time-to-live: 10m
      # 缓存 null 值，防止缓存穿透（配合空对象缓存）
      cache-null-values: true
    cache-names: user,product

# Redisson 分布式锁配置
redisson:
  # 单机模式（生产环境可使用 sentinel / cluster）
  single-server-config:
    address: redis://localhost:6379

# 业务自定义配置
app:
  # 验证码过期时间（分钟）
  captcha:
    expire-minutes: 5
    # 验证码长度
    length: 6
  # Token 过期时间（分钟）
  token:
    expire-minutes: 30
  # 接口限流默认配置（每 IP 每分钟最大请求数）
  rate-limit:
    max-requests: 10
    window-seconds: 60

logging:
  level:
    com.dev.redisspringpra: debug